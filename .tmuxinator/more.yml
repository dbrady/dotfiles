name: more
root: ~/acima/devel

windows:
  - AMC:
      root: ~/acima/devel/application-management-client
      panes:
        - ./start dev
  - BasicAccess:
      root: ~/acima/devel/basic_access
      panes:
        - ./bin/rails server
  - aperture7777:
      root: ~/acima/devel/aperture
      panes:
        - ./gradlew :aperture-gateway:bootRun --args='--server.port=7777'
  - aperture7778:
      root: ~/acima/devel/aperture
      panes:
        - ./gradlew :aperture-gateway:bootRun --args='--server.port=7778'
  - keycloak:
      root: ~/acima/devel/dagger/themes/mp-keycloak-theme
      panes:
        - echo "yarn docker:up:host-db\nyarn dev:watch\nyarn storybook"
